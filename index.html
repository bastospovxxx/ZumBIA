<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import * as AU from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import * as FS from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import * as RT from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const M_fb=(()=>{

// Firebase: init, auth, perfis, servidores, personagem e mundo.
const cfg={apiKey:"AIzaSyD128x6HDwY1lIfvPcIMTV8Z4FV4RZsluY",authDomain:"zumbia-caos.firebaseapp.com",projectId:"zumbia-caos",
  storageBucket:"zumbia-caos.firebasestorage.app",messagingSenderId:"313061472117",appId:"1:313061472117:web:d114b23d8fd9117064c53c",
  measurementId:"G-KMFWH7N3C5",databaseURL:"https://zumbia-caos-default-rtdb.firebaseio.com"};
const app=initializeApp(cfg),auth=AU.getAuth(app),db=FS.getFirestore(app),rtdb=RT.getDatabase(app);
const D=(...p)=>FS.doc(db,...p);
let pending=Promise.resolve();
const watch=f=>AU.onAuthStateChanged(auth,async u=>{await pending;if(u)await ensure(u);f(u)});
const login=(e,p)=>AU.signInWithEmailAndPassword(auth,e,p);
const loginGoogle=()=>AU.signInWithPopup(auth,new AU.GoogleAuthProvider());
const logout=()=>AU.signOut(auth);
const register=(e,p,n)=>pending=(async()=>{const r=await AU.createUserWithEmailAndPassword(auth,e,p);await AU.updateProfile(r.user,{displayName:n});await ensure(r.user,n)})();
async function ensure(u,name){ // perfil criado uma vez; senha nunca vai ao Firestore
  if((await FS.getDoc(D("users",u.uid))).exists())return;
  await FS.setDoc(D("users",u.uid),{uid:u.uid,username:name||u.displayName||"Sobrevivente",email:u.email,createdAt:FS.serverTimestamp(),
    level:1,xp:0,money:50,settings:{vol:.6},server:null,favorites:[],friends:[],stats:{kills:0,deaths:0,quests:0,created:0,hours:0}});
}
const getProfile=async uid=>(await FS.getDoc(D("users",uid))).data();
const patchProfile=(uid,d)=>FS.updateDoc(D("users",uid),d);
const hash=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,"0")).join("");
async function createServer(p,o){
  const r=FS.doc(FS.collection(db,"servers")),seed=Math.floor(Math.random()*2**31);
  await FS.setDoc(r,{id:r.id,ownerUid:p.uid,ownerName:p.username,name:o.name,desc:o.desc,private:o.private,passHash:o.private?await hash(o.pass):"",
    max:o.max,settings:o.settings,seed,banned:[],createdAt:FS.serverTimestamp()});
  await FS.setDoc(D("worlds",r.id),{seed,edits:{}});
  await FS.updateDoc(D("users",p.uid),{"stats.created":FS.increment(1)});return r.id;
}
async function listServers(){
  const l=(await FS.getDocs(FS.query(FS.collection(db,"servers"),FS.orderBy("createdAt","desc"),FS.limit(100)))).docs.map(d=>d.data());
  await Promise.all(l.map(async s=>{try{s.online=(await RT.get(RT.ref(rtdb,`servers/${s.id}/players`))).size}catch{s.online=0}}));return l;
}
async function canJoin(s,uid,pass){
  if(s.banned?.includes(uid))return"Você foi banido deste servidor.";
  if(s.private&&await hash(pass||"")!==s.passHash)return"Senha incorreta.";
  if(s.online>=s.max)return"Servidor lotado.";return null;
}
async function updateServer(id,d){if("pass"in d){d.passHash=d.pass?await hash(d.pass):"";d.private=!!d.pass;delete d.pass}return FS.updateDoc(D("servers",id),d)}
const deleteServer=async id=>{await FS.deleteDoc(D("worlds",id));await FS.deleteDoc(D("servers",id))};
const favorite=(uid,id,on)=>FS.updateDoc(D("users",uid),{favorites:on?FS.arrayUnion(id):FS.arrayRemove(id)});
const loadWorld=async id=>(await FS.getDoc(D("worlds",id))).data()||{};
const loadChar=async uid=>(await FS.getDoc(D("characters",uid))).data()||{};
const saveWorld=(id,edits)=>FS.setDoc(D("worlds",id),{edits},{merge:true});
async function saveChar(uid,sid,c){
  await FS.setDoc(D("characters",uid),{...c,sid,inv:JSON.stringify(c.inv)},{merge:true});
  await FS.updateDoc(D("users",uid),{xp:c.xp,level:c.level,money:c.money,server:sid,"stats.kills":c.kills,"stats.deaths":c.deaths});
}

return {FS,RT,db,rtdb,auth,watch,login,loginGoogle,logout,register,getProfile,patchProfile,createServer,listServers,canJoin,updateServer,deleteServer,favorite,loadWorld,loadChar,saveWorld,saveChar};
})();
const M_data=(()=>{

// Itens, receitas e zumbis. Novo item = nova entrada em I; nova receita = R; novo zumbi = Z.
const I={
  sword:{n:"Espada",c:"#b8c0c8",dmg:14,dur:100,rng:2.6},pipe:{n:"Cano",c:"#8d949a",dmg:20,dur:60,rng:2.6},axe:{n:"Machado",c:"#a0522d",dmg:18,dur:80,rng:2.6},
  wood:{n:"Madeira",c:"#8a5a2b",s:50},stone:{n:"Pedra",c:"#7b7f84",s:50},scrap:{n:"Sucata",c:"#6a6f55",s:50},cloth:{n:"Tecido",c:"#9a8fb0",s:50},
  bread:{n:"Pão",c:"#c9a063",s:10,food:25},canned:{n:"Enlatado",c:"#b3702f",s:10,food:40},water:{n:"Água",c:"#3f7fbf",s:10,water:35},
  bandage:{n:"Bandagem",c:"#d8d2c4",s:10,heal:25},wall:{n:"Parede",c:"#8a6a3a",s:50,place:8}};
const R=[
  {cat:"Medicina",out:"bandage",n:1,in:{cloth:2}},{cat:"Armas",out:"pipe",n:1,in:{scrap:4}},
  {cat:"Ferramentas",out:"axe",n:1,in:{wood:3,stone:2}},{cat:"Construção",out:"wall",n:2,in:{wood:4}}];
const Z={common:{hp:40,sp:1.8,dmg:8,c:0x5f7a4f,xp:10},runner:{hp:25,sp:3.6,dmg:6,c:0x8a7a3a,xp:14},tank:{hp:130,sp:1.2,dmg:18,c:0x4a4a6a,xp:30}};
// Loot contextual por região
const LOOT={hospital:["bandage","bandage","water","cloth"],market:["bread","canned","water","canned"],industrial:["scrap","scrap","wood","stone"],
  houses:["bread","cloth","wood","water","scrap"],military:["scrap","bandage","canned"]};

return {I,R,Z,LOOT};
})();
const M_inv=(()=>{
const {I}=M_data;
const N=41; // 9 hotbar (0-8) + 32 mochila (9-40)
class Inv{
  constructor(s){this.slots=s&&s.length==N?s:Array(N).fill(null)}
  add(id,n=1){const m=I[id].s||1;
    for(const s of this.slots)if(n&&s&&s.id==id&&s.d==null&&s.n<m){const k=Math.min(m-s.n,n);s.n+=k;n-=k}
    for(let i=0;i<N&&n;i++)if(!this.slots[i]){const k=Math.min(m,n);this.slots[i]={id,n:k};if(I[id].dur)this.slots[i].d=I[id].dur;n-=k}return n}
  count(id){return this.slots.reduce((a,s)=>a+(s&&s.id==id?s.n:0),0)}
  take(id,n){this.slots.forEach((s,i)=>{if(s&&s.id==id&&n){const k=Math.min(s.n,n);s.n-=k;n-=k;if(!s.n)this.slots[i]=null}})}
  use(i,k=1){const s=this.slots[i];if(!s)return;s.n-=k;if(s.n<=0)this.slots[i]=null}
  wear(i){const s=this.slots[i];if(!s||s.d==null)return false;if(--s.d<=0){this.slots[i]=null;return true}return false}
  swap(a,b){if(a==b)return;const x=this.slots[a],y=this.slots[b];
    if(x&&y&&x.id==y.id&&x.d==null){const k=Math.min((I[x.id].s||1)-y.n,x.n);y.n+=k;x.n-=k;if(!x.n)this.slots[a]=null;return}
    this.slots[a]=y;this.slots[b]=x}
  split(i){const s=this.slots[i];if(!s||s.n<2)return;const e=this.slots.findIndex(v=>!v);if(e<0)return;const h=s.n>>1;s.n-=h;this.slots[e]={id:s.id,n:h}}
  drop(i){this.slots[i]=null}
  can(r){return Object.entries(r.in).every(([k,v])=>this.count(k)>=v)}
  craft(r){if(!this.can(r))return false;for(const [k,v] of Object.entries(r.in))this.take(k,v);this.add(r.out,r.n||1);return true}
}

return {N,Inv};
})();
const M_world=(()=>{

// Mundo por seed: sempre o mesmo mundo inicial; edições dos jogadores ficam em `edits` (persistidas).
// Tiles: 0 grama,1 rua,2 piso,3 parede,4 porta,5 loot,6 loot vazio,7 árvore,8 parede construída
const B=14;
const h2=(x,y,s)=>{let h=Math.imul(x*374761393+y*668265263+s|0,1274126177);h=Math.imul(h^h>>>13,1103515245);return((h^h>>>16)>>>0)/4294967296};
const REGION={park:"Parque",hospital:"Hospital",market:"Supermercado",industrial:"Zona industrial",houses:"Bairro residencial",military:"Área militar"};
class World{
  constructor(seed,edits){this.seed=seed;this.e=new Map(Object.entries(edits||{}));this.dirty={}}
  region(x,y){const bx=Math.floor(x/B),by=Math.floor(y/B),r=h2(bx,by,this.seed);
    return Math.hypot(bx,by)>7&&r>.9?"military":r<.15?"park":r<.22?"hospital":r<.34?"market":r<.5?"industrial":"houses"}
  gen(x,y){const m=v=>((v%B)+B)%B,lx=m(x),ly=m(y),reg=this.region(x,y),s=this.seed;
    if(lx<2||ly<2)return 1;
    if(reg=="park")return h2(x,y,s+1)<.14?7:0;
    if(lx>=3&&lx<=B-2&&ly>=3&&ly<=B-2){
      if(lx==3||lx==B-2||ly==3||ly==B-2)return(ly==B-2&&lx==7)?4:3;
      return h2(x,y,s+2)<.09?5:2}
    return h2(x,y,s+3)<.05?7:0}
  tile(x,y){const k=x+","+y;return this.e.has(k)?this.e.get(k):this.gen(x,y)}
  set(x,y,t){const k=x+","+y;this.e.set(k,t);this.dirty[k]=t}
  solid(x,y){const t=this.tile(x,y);return t==3||t==5||t==7||t==8}
}
// Renderização 3D: InstancedMesh por tipo de tile, só ao redor do jogador (carregamento por região).
class WorldView{
  constructor(scene,world){this.w=world;this.R=26;this.cx=1e9;this.cz=1e9;
    const box=(w,h,d)=>new THREE.BoxGeometry(w,h,d),mk=(g,c,y,n=3000)=>{const m=new THREE.InstancedMesh(g,new THREE.MeshLambertMaterial({color:c}),n);m.userData.y=y;m.frustumCulled=false;scene.add(m);return m};
    this.m={1:mk(box(1,.1,1),0x33353a,.05),2:mk(box(1,.1,1),0x6a655a,.06),3:mk(box(1,3,1),0x4a4540,1.5),4:mk(box(1,.2,1),0x7a5a2e,.1),
      5:mk(box(.8,.8,.8),0xc9a227,.4),6:mk(box(.8,.3,.8),0x3d3a35,.15),7:mk(new THREE.ConeGeometry(.7,2.6,6),0x1f4a26,1.3),8:mk(box(1,2.4,1),0x8a6a3a,1.2)};
    const g=new THREE.Mesh(new THREE.PlaneGeometry(400,400).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({color:0x2d3a2a}));scene.add(g);this.ground=g}
  update(px,pz,force){const cx=Math.round(px),cz=Math.round(pz);
    this.ground.position.set(cx,0,cz);if(!force&&cx==this.cx&&cz==this.cz)return;this.cx=cx;this.cz=cz;
    const n={},o=new THREE.Object3D(),R=this.R;for(const k in this.m)n[k]=0;
    for(let x=cx-R;x<=cx+R;x++)for(let z=cz-R;z<=cz+R;z++){const t=this.w.tile(x,z),m=this.m[t];if(!m)continue;
      o.position.set(x,m.userData.y,z);o.updateMatrix();m.setMatrixAt(n[t]++,o.matrix)}
    for(const k in this.m){this.m[k].count=n[k];this.m[k].instanceMatrix.needsUpdate=true}}
}

return {B,REGION,World,WorldView};
})();
const M_game=(()=>{
const {I,R,Z,LOOT}=M_data;const {World,WorldView,REGION}=M_world;const {Inv}=M_inv;const FB=M_fb;
// Jogo 3D: jogador, câmera, zumbis, combate, construção, fome/sede, dia/noite, multiplayer, chat, salvamento.
const {RT,rtdb}=FB,$=s=>document.querySelector(s);
const MULT={zq:{baixa:.5,normal:1,alta:1.8,hordas:3},dif:{facil:.6,normal:1,dificil:1.5,apocalipse:2.2},night:{curta:.6,normal:1,longa:1.6}};
const lvlOf=xp=>1+Math.floor(Math.sqrt(xp/50));
const char=c=>{const g=new THREE.Group(),m=new THREE.MeshLambertMaterial({color:c});
  const b=new THREE.Mesh(new THREE.BoxGeometry(.6,.9,.35),m);b.position.y=.9;const h=new THREE.Mesh(new THREE.BoxGeometry(.4,.4,.4),new THREE.MeshLambertMaterial({color:0xd8b08c}));h.position.y=1.55;
  const a=new THREE.Mesh(new THREE.BoxGeometry(.12,.12,.9),new THREE.MeshLambertMaterial({color:0xaaaaaa}));a.position.set(.4,1,.5);g.add(b,h,a);return g};

async function startGame(user,prof,srv,onExit){
  const err=m=>{$("#err").hidden=false;$("#err").textContent="Erro: "+m};
  const [wd,c]=await Promise.race([Promise.all([FB.loadWorld(srv.id),FB.loadChar(user.uid)]),new Promise((_,j)=>setTimeout(()=>j(new Error("Tempo esgotado ao carregar. Confira Firestore e regras.")),15000))]);
  const S=srv.settings||{},zq=MULT.zq[S.zombies]??1,dm=MULT.dif[S.difficulty]??1,nl=MULT.night[S.night]??1;
  const world=new World(wd.seed??srv.seed,wd.edits),inv=new Inv(c.sid==srv.id&&c.inv?JSON.parse(c.inv):null);
  if(!inv.slots.some(Boolean))inv.add("sword");
  const p=c.sid==srv.id?{x:c.x||0,z:c.z||0,hp:c.hp||100,food:c.food??100,water:c.water??100}:{x:0,z:0,hp:100,food:100,water:100};
  Object.assign(p,{xp:c.xp||0,money:c.money??50,kills:c.kills||0,deaths:c.deaths||0,face:0,sel:0,cd:0,dead:false});
  if(p.hp<=0)p.hp=100;
  // cena
  const cv=$("#cv"),r=new THREE.WebGLRenderer({canvas:cv,antialias:true}),sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(55,1,.1,200);
  const amb=new THREE.AmbientLight(0xffffff,.6),sun=new THREE.DirectionalLight(0xffffff,.8);sun.position.set(20,40,10);sc.add(amb,sun);
  const view=new WorldView(sc,world),me=char(0x3a6ea5);sc.add(me);
  let zoom=1,zs=[],others={},omesh={},msgs=[],clock=.3,run=true,open=false,sel=null,mouse={x:0,y:0},keys={};
  const resize=()=>{r.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()};resize();addEventListener("resize",resize);
  // multiplayer (Realtime DB, ~5 Hz)
  const base=`servers/${srv.id}`,meRef=RT.ref(rtdb,`${base}/players/${user.uid}`),un=[];
  try{await RT.set(meRef,{n:prof.username,x:p.x,z:p.z,f:0});RT.onDisconnect(meRef).remove();
    un.push(RT.onValue(RT.ref(rtdb,`${base}/players`),s=>{const o={};s.forEach(ch=>{if(ch.key!=user.uid)o[ch.key]=ch.val()});others=o}));
    un.push(RT.onChildAdded(RT.query(RT.ref(rtdb,`${base}/chat`),RT.limitToLast(15)),s=>{const v=s.val();say(`${v.n}: ${v.t}`)}))}catch(e){err("Realtime DB: "+e.message)}
  const say=t=>{msgs.push(t);msgs=msgs.slice(-8);$("#log").innerHTML=msgs.map(m=>`<div>${m.replace(/</g,"&lt;")}</div>`).join("")};
  // UI
  const slot=(i,k)=>{const s=inv.slots[i],it=s&&I[s.id];return `<div class="sl ${i==p.sel&&k=="h"?"on":""} ${i===sel?"sel":""}" data-i="${i}" style="${it?`box-shadow:inset 0 -5px 0 ${it.c}`:""}">${k=="h"?`<em>${i+1}</em>`:""}${it?`<b>${it.n}</b>`:""}${s&&s.n>1?`<i>${s.n}</i>`:""}${s&&s.d!=null?`<u style="width:${100*s.d/I[s.id].dur}%"></u>`:""}</div>`};
  const drawHot=()=>{$("#hotbar").innerHTML=[...Array(9)].map((_,i)=>slot(i,"h")).join("")};
  const drawInv=()=>{drawHot();if(!open)return;
    $("#inv").innerHTML=`<b>HOTBAR (9)</b><div class="g">${[...Array(9)].map((_,i)=>slot(i,"i")).join("")}</div><b>MOCHILA (32)</b><div class="g">${[...Array(32)].map((_,i)=>slot(i+9,"i")).join("")}</div>
    <small>Clique: mover/trocar · Shift+clique: dividir · Botão direito: usar · Q: descartar selecionado</small><b>CRAFTING</b>${R.map((x,i)=>`<button data-r="${i}" ${inv.can(x)?"":"disabled"}>[${x.cat}] ${I[x.out].n} ×${x.n} ← ${Object.entries(x.in).map(([k,v])=>I[k].n+" "+inv.count(k)+"/"+v).join(", ")}</button>`).join("")}`};
  const useSlot=i=>{const s=inv.slots[i];if(!s)return;const it=I[s.id];

const M_main=(()=>{

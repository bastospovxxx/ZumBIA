const M_auth=(()=>{
const {auth,db,gProvider,createUserWithEmailAndPassword,signInWithEmailAndPassword,signInWithPopup,signOut,onAuthStateChanged,updateProfile,doc,getDoc,setDoc,serverTimestamp}=M_firebase;

let pending=Promise.resolve();

function watch(f){
  onAuthStateChanged(auth,async u=>{await pending;if(u)await ensure(u);f(u)});
}
const login=(e,p)=>signInWithEmailAndPassword(auth,e,p);
const loginGoogle=()=>signInWithPopup(auth,gProvider);
const logout=()=>signOut(auth);

function register(email,pass,name){
  pending=(async()=>{
    const r=await createUserWithEmailAndPassword(auth,email,pass);
    await updateProfile(r.user,{displayName:name});
    await ensure(r.user,name);
  })();
  return pending;
}

// Cria o perfil no Firestore se ainda não existir (nunca guarda senha)
async function ensure(u,name){
  const r=doc(db,"users",u.uid);
  if((await getDoc(r)).exists())return;
  await setDoc(r,{uid:u.uid,username:name||u.displayName||"Sobrevivente",email:u.email,createdAt:serverTimestamp(),

    stats:{kills:0,deaths:0,quests:0,created:0,hours:0}});
  await setDoc(doc(db,"characters",u.uid),{createdAt:serverTimestamp()});
}

return {watch,login,loginGoogle,logout,register,ensure};
})();
const M_servers=(()=>{
const {db,rtdb,RT,collection,doc,setDoc,getDocs,deleteDoc,updateDoc,query,orderBy,limit,serverTimestamp,arrayUnion,arrayRemove,increment}=M_firebase;

const hash=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,"0")).join("");

async function createServer(user,o){
  const r=doc(collection(db,"servers"));
  const seed=Math.floor(Math.random()*2**31);
  await setDoc(r,{id:r.id,ownerUid:user.uid,ownerName:user.username,name:o.name,desc:o.desc,private:o.private,
    passHash:o.private?await hash(o.pass):"",max:o.max,settings:o.settings,seed,banned:[],createdAt:serverTimestamp()});
  await setDoc(doc(db,"worlds",r.id),{seed,edits:{}});
  await updateDoc(doc(db,"users",user.uid),{"stats.created":increment(1)});
  return r.id;
}
const listServers=async()=>(await getDocs(query(collection(db,"servers"),orderBy("createdAt","desc"),limit(100)))).docs.map(d=>d.data());

async function playerCount(id){
  try{return (await RT.get(RT.ref(rtdb,`servers/${id}/players`))).size}catch{return null}
}
async function canJoin(s,uid,pass){
  if(s.banned?.includes(uid))return "Você foi banido deste servidor.";
  if(s.private&&await hash(pass||"")!==s.passHash)return "Senha incorreta.";
  return null;
}
async function deleteServer(id){await deleteDoc(doc(db,"worlds",id));await deleteDoc(doc(db,"servers",id))}
async function updateServer(id,d){
  if(d.pass!==undefined){d.passHash=d.pass?await hash(d.pass):"";d.private=!!d.pass;delete d.pass}
  return updateDoc(doc(db,"servers",id),d);
}
const favorite=(uid,id,on)=>updateDoc(doc(db,"users",uid),{favorites:on?arrayUnion(id):arrayRemove(id)});

return {createServer,listServers,playerCount,canJoin,deleteServer,updateServer,favorite};
})();
const M_items=(()=>{
// Para adicionar um item: nova entrada em I. Para adicionar receita: nova entrada em R.
// Campos: n nome, c cor, s stack, dmg/dur arma, food/water/heal consumível, place tile colocável
const I={
  sword:{n:"Espada",c:"#b8c0c8",dmg:14,dur:100},
  pipe:{n:"Cano",c:"#8d949a",dmg:20,dur:60},

  stone:{n:"Pedra",c:"#7b7f84",s:50},
  scrap:{n:"Sucata",c:"#6a6f55",s:50},
  cloth:{n:"Tecido",c:"#9a8fb0",s:50},

  bandage:{n:"Bandagem",c:"#d8d2c4",s:10,heal:25},
  wall:{n:"Parede",c:"#8a6a3a",s:50,place:8}
};
const R=[
  {cat:"Medicina",out:"bandage",n:1,in:{cloth:2}},
  {cat:"Armas",out:"pipe",n:1,in:{scrap:4}},
  {cat:"Ferramentas",out:"axe",n:1,in:{wood:3,stone:2}},

})();
const M_inventory=(()=>{
const {I}=M_items;
const N=41; // 9 hotbar (0-8) + 32 mochila (9-40)

class Inv{
  constructor(slots){this.slots=slots&&slots.length==N?slots:Array(N).fill(null)}
  add(id,n=1){
    const m=I[id].s||1;
    for(const s of this.slots)if(n&&s&&s.id==id&&s.d==null&&s.n<m){const k=Math.min(m-s.n,n);s.n+=k;n-=k}
    for(let i=0;i<N&&n;i++)if(!this.slots[i]){const k=Math.min(m,n);this.slots[i]={id,n:k};if(I[id].dur)this.slots[i].d=I[id].dur;n-=k}
    return n; // sobra que não coube
  }
  count(id){return this.slots.reduce((a,s)=>a+(s&&s.id==id?s.n:0),0)}
  take(id,n){this.slots.forEach((s,i)=>{if(s&&s.id==id&&n){const k=Math.min(s.n,n);s.n-=k;n-=k;if(!s.n)this.slots[i]=null}})}
  use(i,k=1){const s=this.slots[i];if(!s)return;s.n-=k;if(s.n<=0)this.slots[i]=null}
  wear(i){const s=this.slots[i];if(!s||s.d==null)return false;s.d--;if(s.d<=0){this.slots[i]=null;return true}return false}
  swap(a,b){
    if(a==b)return;const x=this.slots[a],y=this.slots[b];
    if(x&&y&&x.id==y.id&&x.d==null){const k=Math.min((I[x.id].s||1)-y.n,x.n);y.n+=k;x.n-=k;if(!x.n)this.slots[a]=null;return}
    this.slots[a]=y;this.slots[b]=x;
  }
  split(i){
    const s=this.slots[i];if(!s||s.n<2)return;const e=this.slots.findIndex(v=>!v);if(e<0)return;
    const h=s.n>>1;s.n-=h;this.slots[e]={id:s.id,n:h};
  }
  drop(i){this.slots[i]=null}
  can(r){return Object.entries(r.in).every(([k,v])=>this.count(k)>=v)}
  craft(r){
    if(!this.can(r))return false;
    for(const [k,v] of Object.entries(r.in))this.take(k,v);
    this.add(r.out,r.n||1);return true;
  }
}

return {N,Inv};
})();
const M_world=(()=>{
const TS=32,B=14; // tamanho do tile e do quarteirão
// Tiles: 0 grama,1 rua,2 piso,3 parede,4 porta,5 loot,6 loot vazio,7 árvore,8 parede construída
const COLORS=["#2d3a2a","#33353a","#555048","#2a2523","#7a5a2e","#c9a227","#3d3a35","#1f4a26","#8a6a3a"];
const REGION={park:"Parque",hospital:"Hospital",market:"Supermercado",industrial:"Zona industrial",houses:"Bairro residencial",military:"Área militar"};

const hash2=(x,y,s)=>{let h=Math.imul(x*374761393+y*668265263+s|0,1274126177);h=Math.imul(h^h>>>13,1103515245);return((h^h>>>16)>>>0)/4294967296};

class World{
  constructor(seed,edits){this.seed=seed;this.e=new Map(Object.entries(edits||{}));this.dirty={}}
  region(x,y){
    const bx=Math.floor(x/B),by=Math.floor(y/B),r=hash2(bx,by,this.seed),d=Math.hypot(bx,by);
    return d>7&&r>.9?"military":r<.15?"park":r<.22?"hospital":r<.34?"market":r<.5?"industrial":"houses";
  }
  gen(x,y){
    const lx=((x%B)+B)%B,ly=((y%B)+B)%B,s=this.seed;
    if(lx<2||ly<2)return 1;
    if(this.region(x,y)=="park")return hash2(x,y,s)<.12?7:0;
    if(lx<3)return 0;
    const wall=lx==3||lx==B-2||ly==3||ly==B-2;
    if(wall)return ly==3&&lx==7?4:3;
    return hash2(x,y,s+7)<.07?5:2;
  }
  get(x,y){const k=x+"_"+y;return this.e.has(k)?this.e.get(k):this.gen(x,y)}
  set(x,y,t){const k=x+"_"+y;this.e.set(k,t);this.dirty[k]=t}
  solid(x,y){const t=this.get(x,y);return t==3||t==7||t==8}
  hit(px,py,r=9){const f=Math.floor;return this.solid(f((px-r)/TS),f((py-r)/TS))||this.solid(f((px+r)/TS),f((py-r)/TS))||this.solid(f((px-r)/TS),f((py+r)/TS))||this.solid(f((px+r)/TS),f((py+r)/TS))}
  flush(){const d=this.dirty;this.dirty={};return d}
}

// Loot contextual por região
const LOOT={
  hospital:["bandage","cloth","water","bandage"],
  market:["bread","canned","water","bread"],
  industrial:["scrap","pipe","wood","stone"],
  houses:["bread","cloth","wood","water","canned"],
  military:["scrap","bandage","canned","pipe"],
  park:["wood","stone"]
};

return {TS,B,COLORS,REGION,hash2,World,LOOT};
})();
const M_zombies=(()=>{
const {TS}=M_world;
// Para adicionar um zumbi: nova entrada em Z (e, se quiser, regra de spawn em pick()).
const Z={
  common:{n:"Comum",hp:30,sp:55,dmg:6,c:"#6f9a5a",xp:10,r:10},
  runner:{n:"Corredor",hp:18,sp:120,dmg:4,c:"#b5b857",xp:15,r:9},
  tank:{n:"Tanque",hp:110,sp:35,dmg:14,c:"#6b5a8a",xp:40,r:14}
};
const MULT={baixa:.5,normal:1,alta:1.6,hordas:2.5};
const pick=night=>{const k=Math.random();return k<(night?.2:.1)?"tank":k<(night?.5:.35)?"runner":"common"};

class Zombies{
  constructor(settings){this.list=[];this.max=Math.round(12*(MULT[settings.zombies]||1))}
  // p: jogador; noise>0 => zumbis ouvem de longe. Retorna dano causado ao jogador.
  update(dt,p,w,night,noise){
    let dmg=0;const cap=Math.round(this.max*(night?1.8:1));
    if(this.list.length<cap&&Math.random()<dt*2){
      const a=Math.random()*6.283,d=(14+Math.random()*6)*TS,x=p.x+Math.cos(a)*d,y=p.y+Math.sin(a)*d;
      if(!w.hit(x,y,10)){const type=pick(night);this.list.push({x,y,type,hp:Z[type].hp,ang:a,cd:0,wt:0,kx:0,ky:0})}
    }
    for(const z of this.list){
      const d=Z[z.type],dx=p.x-z.x,dy=p.y-z.y,dist=Math.hypot(dx,dy);
      if(dist>28*TS){z.dead=true;continue}
      const sees=dist<(night?11:7)*TS||(noise>0&&dist<14*TS);
      let sp=d.sp;
      if(sees){z.ang=Math.atan2(dy,dx)}
      else{z.wt-=dt;if(z.wt<=0){z.ang=Math.random()*6.283;z.wt=1+Math.random()*3}sp*=.35}
      const vx=Math.cos(z.ang)*sp*dt+z.kx,vy=Math.sin(z.ang)*sp*dt+z.ky;z.kx*=.8;z.ky*=.8;
      let moved=false;
      if(!w.hit(z.x+vx,z.y,d.r)){z.x+=vx;moved=true}
      if(!w.hit(z.x,z.y+vy,d.r)){z.y+=vy;moved=true}
      if(!moved)z.ang+=1.4+Math.random(); // bloqueado: contorna em vez de ir em linha reta
      z.cd-=dt;
      if(dist<26&&z.cd<=0){z.cd=1;dmg+=d.dmg}
    }
    this.list=this.list.filter(z=>!z.dead);
    return dmg;
  }
}

return {Z,Zombies};
})();
const M_game=(()=>{
const {db,rtdb,RT,doc,getDoc,setDoc,updateDoc}=M_firebase;
const {World,TS,COLORS,REGION,LOOT}=M_world;
const {Inv}=M_inventory;
const {I,R}=M_items;
const {Zombies,Z}=M_zombies;

const $=s=>document.querySelector(s);
const DAY=240,DIFF={"Fácil":.6,"Normal":1,"Difícil":1.4,"Apocalipse":2};
let actx;
const beep=(f,d=.08,v=.04)=>{try{actx=actx||new AudioContext();const o=actx.createOscillator(),g=actx.createGain();o.type="square";o.frequency.value=f;g.gain.value=v*(window.zvol??1);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch{}};

async function start(user,prof,srv,onExit){
  const ac=new AbortController(),sig={signal:ac.signal};
  const cv=$("#cv"),cx=cv.getContext("2d");
  $("#screen").hidden=true;$("#game").hidden=false;$("#death").hidden=true;
  const wd=(await getDoc(doc(db,"worlds",srv.id))).data()||{};
  const w=new World(wd.seed??srv.seed,wd.edits);
  const c=(await getDoc(doc(db,"characters",user.uid))).data()||{};
  const inv=new Inv(c.inv?JSON.parse(c.inv):null);
  if(!c.inv){inv.add("sword");inv.add("bread",2);inv.add("water",2);inv.add("bandage")}
  const same=c.sid===srv.id&&c.x!=null;
  const p={x:same?c.x:TS/2,y:same?c.y:TS/2,hp:c.hp>0?c.hp:100,food:c.food??100,water:c.water??100,xp:c.xp||0,money:c.money??50,sel:0,cd:0,kills:c.kills||0,deaths:c.deaths||0};
  const lvl=()=>1+Math.floor(Math.sqrt(p.xp/50));
  const zs=new Zombies(srv.settings),keys={},m={x:0,y:0},cam={x:p.x,y:p.y},vis={};
  let others={},noise=0,dead=false,chatOn=false,mdown=false,sent=0,raf,last=performance.now(),tsave=Date.now(),hudAt=0,stepT=0;
  const resize=()=>{cv.width=innerWidth;cv.height=innerHeight};resize();addEventListener("resize",resize,sig);
  const tod=()=>(Date.now()/1000/DAY)%1,nightF=()=>Math.max(0,Math.min(1,-Math.sin(tod()*6.283)*2));
  const mw=()=>({x:m.x+cam.x-cv.width/2,y:m.y+cam.y-cv.height/2});

  // ---------- chat / rede ----------
  const say=t=>{const d=document.createElement("div");d.textContent=t;const l=$("#log");l.append(d);while(l.children.length>8)l.firstChild.remove()};
  say("Bem-vindo ao "+srv.name+". WASD move, clique ataca, E mochila, F coletar, Enter chat.");
  const base=`servers/${srv.id}`,unsub=[];let meRef;
  try{
    meRef=RT.ref(rtdb,`${base}/players/${user.uid}`);
    RT.onDisconnect(meRef).remove();
    unsub.push(RT.onValue(RT.ref(rtdb,`${base}/players`),s=>{const o={};s.forEach(ch=>{if(ch.key!=user.uid)o[ch.key]=ch.val()});others=o}));
    unsub.push(RT.onChildAdded(RT.query(RT.ref(rtdb,`${base}/chat`),RT.limitToLast(15)),s=>{const v=s.val();say(`${v.n}: ${v.t}`)}));
  }catch(e){say("Multiplayer indisponível: "+e.message)}
  const msg=$("#msg");
  msg.addEventListener("keydown",e=>{e.stopPropagation();
    if(e.key=="Enter"){const t=msg.value.trim();if(t)try{RT.push(RT.ref(rtdb,`${base}/chat`),{uid:user.uid,n:prof.username,t,ts:Date.now()})}catch{}}
    if(e.key=="Enter"||e.key=="Escape"){msg.value="";msg.hidden=true;chatOn=false}},sig);

  // ---------- inventário / UI ----------
  const slot=i=>{const s=inv.slots[i],d=s&&I[s.id];
    return `<div class="sl${i==p.sel?" on":""}" draggable="true" data-i="${i}"${s?` style="--c:${d.c}"`:""}>${s?`<b>${d.n}</b>${s.n>1?`<i>${s.n}</i>`:""}${s.d!=null?`<u style="width:${s.d/d.dur*100}%"></u>`:""}`:""}${i<9?`<em>${i+1}</em>`:""}</div>`};
  function ui(){
    $("#hotbar").innerHTML=[...Array(9).keys()].map(slot).join("");
    if($("#inv").hidden)return;
    $("#inv").innerHTML=`<div class="g">${[...Array(32).keys()].map(i=>slot(i+9)).join("")}</div>
      <small>Arraste para mover. Shift+clique divide. Botão direito descarta.</small>
      ${R.map((r,i)=>`<button data-r="${i}" ${inv.can(r)?"":"disabled"}>${r.cat}: ${I[r.out].n} x${r.n||1} — ${Object.entries(r.in).map(([k,v])=>v+" "+I[k].n).join(", ")}</button>`).join("")}`;
  }
  const evs=el=>{
    el.addEventListener("dragstart",e=>{const s=e.target.closest(".sl");if(s)e.dataTransfer.setData("t",s.dataset.i)},sig);
    el.addEventListener("dragover",e=>e.preventDefault(),sig);
    el.addEventListener("drop",e=>{e.preventDefault();const s=e.target.closest(".sl");if(s){inv.swap(+e.dataTransfer.getData("t"),+s.dataset.i);ui()}},sig);
    el.addEventListener("click",e=>{const s=e.target.closest(".sl"),b=e.target.closest("button");
      if(s){const i=+s.dataset.i;if(e.shiftKey)inv.split(i);else if(i<9)p.sel=i;ui()}
      if(b&&b.dataset.r){if(inv.craft(R[b.dataset.r]))beep(520);ui()}},sig);
    el.addEventListener("contextmenu",e=>{e.preventDefault();const s=e.target.closest(".sl");if(s){inv.drop(+s.dataset.i);ui()}},sig);
  };
  evs($("#hotbar"));evs($("#inv"));ui();

  // ---------- ações ----------
  function attack(){
    if(p.cd>0||dead)return;const s=inv.slots[p.sel];if(!s)return;const d=I[s.id],t=mw();
    if(d.dmg){
      p.cd=.4;noise=1.5;beep(220,.06);
      const a=Math.atan2(t.y-p.y,t.x-p.x);
      for(const z of zs.list){
        const dx=z.x-p.x,dy=z.y-p.y,dist=Math.hypot(dx,dy);
        if(dist<52&&(dx*Math.cos(a)+dy*Math.sin(a))/(dist||1)>.3){
          z.hp-=d.dmg;z.kx=dx/dist*6;z.ky=dy/dist*6;beep(120,.05);
          if(z.hp<=0){z.dead=true;p.kills++;p.xp+=Z[z.type].xp;if(Math.random()<.3)inv.add("cloth");if(Math.random()<.2)inv.add("scrap")}
        }
      }
      if(inv.wear(p.sel))say(d.n+" quebrou!");
    }else if(d.food||d.water||d.heal){
      p.cd=.5;p.food=Math.min(100,p.food+(d.food||0));p.water=Math.min(100,p.water+(d.water||0));p.hp=Math.min(100,p.hp+(d.heal||0));inv.use(p.sel);beep(330,.1);
    }else if(d.place){
      const tx=Math.floor(t.x/TS),ty=Math.floor(t.y/TS);
      if(canPlace(tx,ty)){w.set(tx,ty,d.place);inv.use(p.sel);p.cd=.2;beep(180,.06)}
    }
    ui();
  }
  const canPlace=(tx,ty)=>Math.hypot((tx+.5)*TS-p.x,(ty+.5)*TS-p.y)<5*TS&&[0,2].includes(w.get(tx,ty))&&!(Math.floor(p.x/TS)==tx&&Math.floor(p.y/TS)==ty);
  function interact(){
    const px=Math.floor(p.x/TS),py=Math.floor(p.y/TS);
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(w.get(px+dx,py+dy)==5){
      const tbl=LOOT[w.region(px+dx,py+dy)]||LOOT.houses,n=1+Math.floor(Math.random()*(srv.settings.loot=="alta"?4:srv.settings.loot=="baixa"?2:3));
      for(let i=0;i<n;i++){const id=tbl[Math.floor(Math.random()*tbl.length)];inv.add(id,1+Math.floor(Math.random()*2));say("+ "+I[id].n)}
      w.set(px+dx,py+dy,6);p.xp+=2;beep(440,.1);ui();return;
    }
  }

  // ---------- entrada ----------
  addEventListener("keydown",e=>{
    if(chatOn)return;keys[e.code]=1;
    if(/^Digit[1-9]$/.test(e.code)){p.sel=+e.code[5]-1;ui()}
    if(e.code=="KeyE"){const v=$("#inv");v.hidden=!v.hidden;ui()}
    if(e.code=="KeyF")interact();
    if(e.code=="Enter"){chatOn=true;msg.hidden=false;msg.focus();e.preventDefault()}
    if(e.code=="Escape"){if(!$("#inv").hidden){$("#inv").hidden=true}else if(confirm("Salvar e sair do servidor?"))quit()}
  },sig);
  addEventListener("keyup",e=>{keys[e.code]=0},sig);
  cv.addEventListener("mousemove",e=>{m.x=e.offsetX;m.y=e.offsetY},sig);
  cv.addEventListener("mousedown",e=>{if(e.button==0){mdown=true;attack()}},sig);
  addEventListener("mouseup",()=>mdown=false,sig);
  cv.addEventListener("contextmenu",e=>e.preventDefault(),sig);
  cv.addEventListener("wheel",e=>{p.sel=(p.sel+(e.deltaY>0?1:8))%9;ui()},{passive:true,signal:ac.signal});
  $("#resp").onclick=()=>{p.hp=100;p.food=p.water=60;p.x=p.y=TS/2;zs.list=[];dead=false;$("#death").hidden=true;save()};
  addEventListener("beforeunload",()=>{save();try{RT.remove(meRef)}catch{}},sig);

  // ---------- salvamento ----------
  async function save(){
    const d=w.flush();
    try{
      await setDoc(doc(db,"characters",user.uid),{sid:srv.id,x:Math.round(p.x),y:Math.round(p.y),hp:Math.round(p.hp),food:p.food,water:p.water,xp:p.xp,level:lvl(),money:p.money,kills:p.kills,deaths:p.deaths,inv:JSON.stringify(inv.slots)},{merge:true});
      await updateDoc(doc(db,"users",user.uid),{xp:p.xp,level:lvl(),money:p.money,server:srv.id,"stats.kills":p.kills,"stats.deaths":p.deaths});
      if(Object.keys(d).length)await setDoc(doc(db,"worlds",srv.id),{edits:d},{merge:true});
    }catch(e){Object.assign(w.dirty,d);console.warn("save",e)}
  }
  async function quit(){
    cancelAnimationFrame(raf);ac.abort();unsub.forEach(f=>{try{f()}catch{}});
    try{await RT.remove(meRef)}catch{}
    await save();Object.assign(prof,{xp:p.xp,level:lvl(),money:p.money});
    $("#game").hidden=true;onExit();
  }

  // ---------- loop ----------
  function update(dt){
    if(dead)return;
    let dx=(keys.KeyD?1:0)-(keys.KeyA?1:0),dy=(keys.KeyS?1:0)-(keys.KeyW?1:0);
    if(dx||dy){const l=Math.hypot(dx,dy),sp=(keys.ShiftLeft?190:130)*dt;dx=dx/l*sp;dy=dy/l*sp;
      if(!w.hit(p.x+dx,p.y,9))p.x+=dx;if(!w.hit(p.x,p.y+dy,9))p.y+=dy;
      if((stepT-=dt)<=0){beep(80,.03,.015);stepT=.38}}
    p.cd-=dt;noise-=dt;if(mdown)attack();
    p.food=Math.max(0,p.food-dt*.12);p.water=Math.max(0,p.water-dt*.18);
    if(!p.food||!p.water)p.hp-=dt;
    else if(p.hp<100&&p.food>50&&p.water>50)p.hp=Math.min(100,p.hp+dt*(srv.settings.regen=="difícil"?.15:.4));
    p.hp-=zs.update(dt,p,w,nightF()>.5,noise)*(DIFF[srv.settings.diff]||1);
    if(p.hp<=0){p.hp=0;dead=true;p.deaths++;$("#death").hidden=false;beep(60,.4)}
  }
  function draw(){
    const W=cv.width,H=cv.height;cam.x+=(p.x-cam.x)*.12;cam.y+=(p.y-cam.y)*.12;
    const ox=Math.round(W/2-cam.x),oy=Math.round(H/2-cam.y);
    const x0=Math.floor(-ox/TS),y0=Math.floor(-oy/TS),x1=x0+Math.ceil(W/TS)+1,y1=y0+Math.ceil(H/TS)+1;
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
      const t=w.get(x,y);cx.fillStyle=COLORS[t];cx.fillRect(x*TS+ox,y*TS+oy,TS,TS);
      if(t==5){cx.fillStyle="#fff7";cx.fillRect(x*TS+ox+9,y*TS+oy+9,14,14)}
    }
    const d=I[inv.slots[p.sel]?.id]||{},t=mw();
    if(d.place){const tx=Math.floor(t.x/TS),ty=Math.floor(t.y/TS);cx.fillStyle=canPlace(tx,ty)?"#3f8f4a99":"#b8402f99";cx.fillRect(tx*TS+ox,ty*TS+oy,TS,TS)}
    for(const z of zs.list){const zd=Z[z.type];cx.fillStyle=zd.c;cx.beginPath();cx.arc(z.x+ox,z.y+oy,zd.r,0,6.283);cx.fill();
      cx.fillStyle="#000a";cx.fillRect(z.x+ox-10,z.y+oy-zd.r-6,20,3);cx.fillStyle="#b8402f";cx.fillRect(z.x+ox-10,z.y+oy-zd.r-6,20*z.hp/zd.hp,3)}
    cx.textAlign="center";cx.font="12px sans-serif";
    for(const id in others){const o=others[id],v=vis[id]||(vis[id]={x:o.x,y:o.y});v.x+=(o.x-v.x)*.2;v.y+=(o.y-v.y)*.2;
      cx.fillStyle="#4a7fc0";cx.beginPath();cx.arc(v.x+ox,v.y+oy,10,0,6.283);cx.fill();cx.fillStyle="#fff";cx.fillText(o.n||"?",v.x+ox,v.y+oy-16)}
    cx.fillStyle="#d8c7a0";cx.beginPath();cx.arc(p.x+ox,p.y+oy,10,0,6.283);cx.fill();
    if(d.dmg){const a=Math.atan2(t.y-p.y,t.x-p.x);cx.strokeStyle=d.c;cx.lineWidth=3;cx.beginPath();cx.moveTo(p.x+ox+Math.cos(a)*10,p.y+oy+Math.sin(a)*10);cx.lineTo(p.x+ox+Math.cos(a)*30,p.y+oy+Math.sin(a)*30);cx.stroke()}
    cx.fillStyle="#fff";cx.fillText(prof.username,p.x+ox,p.y+oy-16);
    const n=nightF();if(n>0){cx.fillStyle=`rgba(4,8,22,${.72*n})`;cx.fillRect(0,0,W,H)}
  }
  const bar=(l,v,c)=>`<div>${l}<div class="bar"><i style="width:${Math.max(0,v)}%;background:${c}"></i></div></div>`;
  function hud(now){
    if(now-hudAt<200)return;hudAt=now;
    const lv=lvl(),base=50*(lv-1)**2,nx=50*lv**2;
    $("#hud").innerHTML=bar("Vida",p.hp,"#b8402f")+bar("Fome",p.food,"#c9a063")+bar("Sede",p.water,"#3f7fbf")+bar("XP nível "+lv,(p.xp-base)/(nx-base)*100,"#c8a02a")
      +`<div>$ ${p.money} · ${REGION[w.region(Math.floor(p.x/TS),Math.floor(p.y/TS))]}</div><div>${nightF()>.5?"Noite":"Dia"} · jogadores: ${Object.keys(others).length+1}/${srv.max} · zumbis: ${zs.list.length}</div>`;
  }
  function loop(now){
    raf=requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
    update(dt);draw();hud(now);
    if(meRef&&now-sent>150){sent=now;try{RT.set(meRef,{x:Math.round(p.x),y:Math.round(p.y),n:prof.username,hp:Math.round(p.hp),w:inv.slots[p.sel]?.id||null}).catch(()=>{})}catch{}}
    if(Date.now()-tsave>20000){tsave=Date.now();save()}
  }
  raf=requestAnimationFrame(loop);
}

return {start};
})();
const M_ui=(()=>{
const {watch,login,register,loginGoogle,logout}=M_auth;
const {db,doc,getDoc,updateDoc}=M_firebase;
const S=M_servers;
const {start}=M_game;

const $=s=>document.querySelector(s),scr=$("#screen");
let U,P;
const show=h=>{scr.hidden=false;scr.innerHTML=h};
const fail=e=>alert(String(e?.message||e).replace("Firebase: ","").trim());
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const head=`<h1 class="t">ZOMBIE TROUBLE</h1>`;
const refresh=async()=>{P=(await getDoc(doc(db,"users",U.uid))).data();window.zvol=P.settings?.vol??.6};

watch(async u=>{U=u;if(!u)return authView("login");await refresh();menu()});

function authView(mode){
  const reg=mode=="reg";
  show(`${head}<div class="sub">Sobreviva. Construa. Resista.</div><div class="box"><h2>${reg?"Criar conta":"Entrar"}</h2>
    ${reg?`<div><label>Nome do jogador</label><input id="nm" maxlength="20"></div>`:""}
    <div><label>Email</label><input id="em" type="email"></div>
    <div><label>Senha</label><input id="pw" type="password"></div>
    ${reg?`<div><label>Confirmar senha</label><input id="pw2" type="password"></div>`:""}
    <button class="p" id="go">${reg?"Criar conta":"Entrar"}</button>
    <button id="gg">Entrar com Google</button>
    <button id="sw">${reg?"Já tenho conta":"Criar conta"}</button></div>`);
  $("#go").onclick=async()=>{try{
    if(reg){const n=$("#nm").value.trim();
      if(n.length<3)throw "O nome precisa ter ao menos 3 letras.";
      if($("#pw").value!=$("#pw2").value)throw "As senhas não conferem.";
      await register($("#em").value,$("#pw").value,n)}
    else await login($("#em").value,$("#pw").value)}catch(e){fail(e)}};
  $("#gg").onclick=()=>loginGoogle().catch(fail);
  $("#sw").onclick=()=>authView(reg?"login":"reg");
}

function menu(){
  show(`${head}<div class="sub">${esc(P.username)} · nível ${P.level} · ${P.xp} XP · $${P.money} · <span class="on">online</span></div>
    <div class="box menu"><button class="p" id="b1">JOGAR</button><button id="b2">SERVIDORES</button><button id="b3">CRIAR SERVIDOR</button><button id="b4">PERFIL</button><button id="b5">CONFIGURAÇÕES</button><button id="b6">SAIR</button></div>`);
  $("#b1").onclick=async()=>{
    if(P.server){try{const d=await getDoc(doc(db,"servers",P.server));if(d.exists())return join(d.data())}catch(e){return fail(e)}}
    serversView();
  };
  $("#b2").onclick=()=>serversView();$("#b3").onclick=createView;$("#b4").onclick=profileView;$("#b5").onclick=settingsView;
  $("#b6").onclick=()=>logout();
}

async function join(s){
  const mine=s.ownerUid==U.uid;
  const pass=s.private&&!mine?prompt("Senha do servidor:")||"":"";
  const cnt=await S.playerCount(s.id);
  if(cnt!=null&&cnt>=s.max)return alert("Servidor cheio.");
  const err=mine?null:await S.canJoin(s,U.uid,pass);
  if(err)return alert(err);
  start(U,P,s,menu).catch(e=>{fail(e);menu()});
}

async function serversView(sort="recentes",q=""){
  show(`${head}<div class="box wide"><div class="row"><input id="q" placeholder="Pesquisar servidor" value="${esc(q)}">
    <select id="so">${["recentes","jogadores","nome","favoritos"].map(o=>`<option ${o==sort?"selected":""}>${o}</option>`).join("")}</select>
    <button id="rf">ATUALIZAR</button><button id="bk">VOLTAR</button></div><div id="ls">Carregando…</div></div>`);
  $("#bk").onclick=menu;$("#rf").onclick=()=>serversView($("#so").value,$("#q").value);
  $("#so").onchange=$("#rf").onclick;$("#q").onkeydown=e=>{if(e.key=="Enter")$("#rf").onclick()};
  let list;try{list=await S.listServers();await Promise.all(list.map(async s=>s.cnt=await S.playerCount(s.id)))}catch(e){return fail(e)}
  const fav=new Set(P.favorites||[]);
  list=list.filter(s=>(s.name+s.desc+s.ownerName).toLowerCase().includes(q.toLowerCase()));
  const key={jogadores:(a,b)=>(b.cnt||0)-(a.cnt||0),nome:(a,b)=>a.name.localeCompare(b.name),favoritos:(a,b)=>fav.has(b.id)-fav.has(a.id)}[sort];
  if(key)list.sort(key);
  $("#ls").innerHTML=list.map(s=>`<div class="srv"><div><b>${esc(s.name)}</b> ${s.private?"🔒 privado":"público"}${fav.has(s.id)?" ★":""}
    <small>${esc(s.desc)}</small>
    <small>Dono: ${esc(s.ownerName)} · ${s.cnt??0}/${s.max} jogadores · ${esc(s.settings?.diff)} · ${s.cnt==null?'<span class="off">sem status</span>':'<span class="on">online</span>'} · criado em ${s.createdAt?.toDate?.().toLocaleDateString("pt-BR")||"—"}</small></div>
    <div class="row" style="flex-direction:column"><button class="p" data-a="join" data-id="${s.id}">ENTRAR</button>
    <button data-a="fav" data-id="${s.id}">${fav.has(s.id)?"DESFAVORITAR":"FAVORITAR"}</button>
    ${s.ownerUid==U.uid?`<button data-a="edit" data-id="${s.id}">EDITAR</button><button class="d" data-a="del" data-id="${s.id}">EXCLUIR</button>`:""}</div></div>`).join("")||"Nenhum servidor encontrado. Crie o primeiro.";
  $("#ls").onclick=async e=>{
    const b=e.target.closest("button");if(!b)return;const s=list.find(x=>x.id==b.dataset.id);
    try{
      if(b.dataset.a=="join")return join(s);
      if(b.dataset.a=="fav"){await S.favorite(U.uid,s.id,!fav.has(s.id));await refresh()}
      if(b.dataset.a=="del"){if(!confirm(`Excluir "${s.name}" para sempre? O mundo e as construções serão apagados.`))return;await S.deleteServer(s.id)}
      if(b.dataset.a=="edit"){
        const name=prompt("Nome",s.name);if(name===null)return;
        const desc=prompt("Descrição",s.desc);if(desc===null)return;
        const max=+prompt("Limite de jogadores (2, 4, 6, 8, 10, 15, 20)",s.max);if(![2,4,6,8,10,15,20].includes(max))return alert("Limite inválido.");
        const d={name,desc,max,settings:{...s.settings,pvp:confirm("Ligar PvP? (OK = ligado)")?"ligado":"desligado"}};
        const pw=prompt("Nova senha (vazio = servidor público, Cancelar = manter)","");if(pw!==null)d.pass=pw;
        await S.updateServer(s.id,d);
      }
      serversView($("#so").value,$("#q").value);
    }catch(err){fail(err)}
  };
}

const FIELDS=[["max","Limite de jogadores",[2,4,6,8,10,15,20]],["diff","Dificuldade",["Fácil","Normal","Difícil","Apocalipse"]],
  ["pvp","PvP",["desligado","ligado"]],["ff","Fogo amigo",["desligado","ligado"]],["zombies","Quantidade de zumbis",["baixa","normal","alta","hordas"]],
  ["loot","Quantidade de loot",["baixa","normal","alta"]],["night","Duração da noite",["curta","normal","longa"]],["weather","Clima",["normal","variável","extremo"]],
  ["regen","Regeneração",["normal","difícil"]],["build","Construção",["normal","livre"]]];

function createView(){
  show(`${head}<div class="box wide"><h2>Criar servidor</h2>
    <div><label>Nome</label><input id="n" maxlength="30"></div><div><label>Descrição</label><input id="d" maxlength="100"></div>
    <div class="grid"><div><label>Visibilidade</label><select id="pv"><option value="0">Público</option><option value="1">Privado</option></select></div>
    <div><label>Senha (obrigatória se privado)</label><input id="pw" type="password"></div>
    ${FIELDS.map(([k,l,o])=>`<div><label>${l}</label><select id="f_${k}">${o.map(v=>`<option>${v}</option>`).join("")}</select></div>`).join("")}</div>
    <div class="row"><button class="p" id="ok">CRIAR SERVIDOR</button><button id="bk">VOLTAR</button></div></div>`);
  FIELDS.forEach(([k,,o])=>{if(o.includes("normal"))$("#f_"+k).value="normal"});$("#f_max").value=10;
  $("#bk").onclick=menu;
  $("#ok").onclick=async()=>{try{
    const name=$("#n").value.trim(),priv=$("#pv").value=="1",pass=$("#pw").value;
    if(name.length<3)throw "Dê um nome ao servidor (mínimo 3 letras).";
    if(priv&&pass.length<4)throw "Servidor privado precisa de senha (mínimo 4 caracteres).";
    const settings={};FIELDS.forEach(([k])=>settings[k]=$("#f_"+k).value);const max=+settings.max;delete settings.max;
    const id=await S.createServer({uid:U.uid,username:P.username},{name,desc:$("#d").value.trim(),private:priv,pass,max,settings});
    await refresh();alert("Servidor criado. Ele continua existindo até você excluí-lo.");serversView();
  }catch(e){fail(e)}};
}

function profileView(){
  const s=P.stats||{},ach=[["Primeiro zumbi",s.kills>=1],["100 zumbis",s.kills>=100],["1.000 zumbis",s.kills>=1000],["Primeiro servidor",s.created>=1]];
  show(`${head}<div class="box"><h2>${esc(P.username)}</h2>
    <div>Nível ${P.level} · ${P.xp} XP · $${P.money}</div><div>Zumbis derrotados: ${s.kills||0} · Mortes: ${s.deaths||0}</div>
    <div>Servidores criados: ${s.created||0} · Missões concluídas: ${s.quests||0}</div>
    <h3>Conquistas</h3>${ach.map(([n,ok])=>`<div class="${ok?"on":""}">${ok?"✔":"✖"} ${n}</div>`).join("")}
    <button id="bk">VOLTAR</button></div>`);
  $("#bk").onclick=menu;
}

function settingsView(){
  show(`${head}<div class="box"><h2>Configurações</h2><label>Volume dos efeitos sonoros</label>
    <input id="v" type="range" min="0" max="1" step=".05" value="${P.settings?.vol??.6}">
    <div class="row"><button class="p" id="ok">SALVAR</button><button id="bk">VOLTAR</button></div></div>`);
  $("#bk").onclick=menu;
  $("#ok").onclick=async()=>{try{await updateDoc(doc(db,"users",U.uid),{"settings.vol":+$("#v").value});await refresh();menu()}catch(e){fail(e)}};
}

return {};
})();
</script></body></html>

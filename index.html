const M_inv=(()=>{
const {I}=M_data;
const N=41; // 9 hotbar (0-8) + 32 mochila (9-40)
class Inv{
  constructor(s){this.slots=s&&s.length==N?s:Array(N).fill(null)}
  add(id,n=1){const m=I[id].s||1;
    for(const s of this.slots)if(n&&s&&s.id==id&&s.d==null&&s.n<m){const k=Math.min(m-s.n,n);s.n+=k;n-=k}
    for(let i=0;i<N&&n;i++)if(!this.slots[i]){const k=Math.min(m,n);this.slots[i]={id,n:k};if(I[id].dur)this.slots[i].d=I[id].dur;n-=k}return n}
  count(id){return this.slots.reduce((a,s)=>a+(s&&s.id==id?s.n:0),0)}
  take(id,n){this.slots.forEach((s,i)=>{if(s&&s.id==id&&n){const k=Math.min(s.n,n);s.n-=k;n-=k;if(!s.n)this.slots[i]=null}})}
  use(i,k=1){const s=this.slots[i];if(!s)return;s.n-=k;if(s.n<=0)this.slots[i]=null}
  wear(i){const s=this.slots[i];if(!s||s.d==null)return false;if(--s.d<=0){this.slots[i]=null;return true}return false}
  swap(a,b){if(a==b)return;const x=this.slots[a],y=this.slots[b];
    if(x&&y&&x.id==y.id&&x.d==null){const k=Math.min((I[x.id].s||1)-y.n,x.n);y.n+=k;x.n-=k;if(!x.n)this.slots[a]=null;return}
    this.slots[a]=y;this.slots[b]=x}
  split(i){const s=this.slots[i];if(!s||s.n<2)return;const e=this.slots.findIndex(v=>!v);if(e<0)return;const h=s.n>>1;s.n-=h;this.slots[e]={id:s.id,n:h}}
  drop(i){this.slots[i]=null}
  can(r){return Object.entries(r.in).every(([k,v])=>this.count(k)>=v)}
  craft(r){if(!this.can(r))return false;for(const [k,v] of Object.entries(r.in))this.take(k,v);this.add(r.out,r.n||1);return true}
}

return {N,Inv};

const M_world=(()=>{

class World{

  region(x,y){const bx=Math.floor(x/B),by=Math.floor(y/B),r=h2(bx,by,this.seed);
    return Math.hypot(bx,by)>7&&r>.9?"military":r<.15?"park":r<.22?"hospital":r<.34?"market":r<.5?"industrial":"houses"}
  gen(x,y){const m=v=>((v%B)+B)%B,lx=m(x),ly=m(y),reg=this.region(x,y),s=this.seed;

      if(lx==3||lx==B-2||ly==3||ly==B-2)return(ly==B-2&&lx==7)?4:3;

  tile(x,y){const k=x+","+y;return this.e.has(k)?this.e.get(k):this.gen(x,y)}
  set(x,y,t){const k=x+","+y;this.e.set(k,t);this.dirty[k]=t}
  prop(x,y){if(this.e.has(x+","+y))return null;const t=this.gen(x,y),m=v=>((v%B)+B)%B,lx=m(x),ly=m(y),h=h2(x,y,this.seed+9),X=lx<2&&ly<2;
    if(t==1){if(!X&&(lx==1&&ly%4==2||ly==1&&lx%4==2))return"lamp";return X?null:h<.035?"car":h<.07?"junk":null}

    return t==0&&h<.04?"junk":null}
  solid(x,y){const t=this.tile(x,y);if(t==3||t==5||t==7||t==8)return true;if(t==1||t==2){const q=this.prop(x,y);return q=="car"||q=="lamp"||q=="furn"}return false}
}

  constructor(scene,world){this.w=world;this.R=26;this.cx=1e9;this.cz=1e9;
    const box=(w,h,d)=>new THREE.BoxGeometry(w,h,d),mk=(g,c,y,n=3000)=>{const m=new THREE.InstancedMesh(g,new THREE.MeshLambertMaterial({color:c}),n);m.userData.y=y;m.frustumCulled=false;scene.add(m);return m};
    this.m={1:mk(box(1,.1,1),0x33353a,.05),2:mk(box(1,.1,1),0x6a655a,.06),3:mk(box(1,3,1),0x4a4540,1.5),4:mk(box(1,.2,1),0x7a5a2e,.1),

    if(d.j)join(s);if(d.f){await FB.favorite(U.uid,s.id,!(P.favorites||[]).includes(s.id));await load()}
    if(d.x&&confirm(`Excluir "${s.name}" PERMANENTEMENTE?`)){await FB.deleteServer(s.id);await load()}
    if(d.e){const n=prompt("Nome:",s.name);if(n===null)return;const ds=prompt("Descrição:",s.desc);const pw=prompt("Senha (vazio = público):","");const mx=prompt("Limite de jogadores:",s.max);
      await FB.updateServer(s.id,{name:n,desc:ds,pass:pw||"",max:+mx||s.max});await load()}}catch(e){fail(e)}};load()}
async function join(s){try{let pass="";if(s.private&&s.ownerUid!=U.uid)pass=prompt("Senha do servidor:")||"";
  s.online=(await FB.listServers()).find(x=>x.id==s.id)?.online??0;const m=s.ownerUid==U.uid?null:await FB.canJoin(s,U.uid,pass);if(m)return fail(m);
  await startGame(U,P,s,menu)}catch(e){fail(e);menu()}}
function create(){scr(`<div class="box wide"><h2>CRIAR SERVIDOR</h2><div class="grid">${f("n","Nome")}${f("d","Descrição")}
  ${sel("pv","Visibilidade",[["0","Público"],["1","Privado"]])}${f("pw","Senha (se privado)","password")}${sel("mx","Limite",[2,4,6,8,10,15,20].map(x=>[x,x]))}
  ${sel("df","Dificuldade",[["facil","Fácil"],["normal","Normal"],["dificil","Difícil"],["apocalipse","Apocalipse"]])}${sel("pvp","PvP",[["0","Desligado"],["1","Ligado"]])}${sel("ff","Fogo amigo",[["0","Desligado"],["1","Ligado"]])}
  ${sel("zb","Zumbis",[["baixa","Baixa"],["normal","Normal"],["alta","Alta"],["hordas","Hordas"]])}${sel("lt","Loot",[["baixa","Baixa"],["normal","Normal"],["alta","Alta"]])}
  ${sel("nt","Duração da noite",[["curta","Curta"],["normal","Normal"],["longa","Longa"]])}${sel("cl","Clima",[["normal","Normal"],["variavel","Variável"],["extremo","Extremo"]])}
  ${sel("rg","Regeneração",[["normal","Normal"],["dificil","Difícil"]])}${sel("cn","Construção",[["normal","Normal"],["livre","Livre"]])}</div>
  <div class="row"><button class="p" id="ok">CRIAR</button><button id="bk">CANCELAR</button></div></div>`);
  $("#bk").onclick=menu;$("#ok").onclick=async()=>{const n=$("#n").value.trim(),pv=$("#pv").value=="1",pw=$("#pw").value;if(n.length<3)return fail("Nome muito curto.");if(pv&&!pw)return fail("Servidor privado exige senha.");
    try{await FB.createServer(P,{name:n,desc:$("#d").value,private:pv,pass:pw,max:+$("#mx").value,settings:{difficulty:$("#df").value,pvp:$("#pvp").value=="1",friendlyFire:$("#ff").value=="1",zombies:$("#zb").value,loot:$("#lt").value,night:$("#nt").value,weather:$("#cl").value,regen:$("#rg").value,build:$("#cn").value}});servers()}catch(e){fail(e)}}}
function profile(){const s=P.stats||{};scr(`<div class="box"><h2>${P.username}</h2>Nível ${P.level} · XP ${P.xp} · $${P.money}<br>Zumbis derrotados: ${s.kills}<br>Mortes: ${s.deaths}<br>Missões: ${s.quests}<br>Servidores criados: ${s.created}<button id="bk">VOLTAR</button></div>`);$("#bk").onclick=menu}
function settings(){scr(`<div class="box"><h2>CONFIGURAÇÕES</h2><label>Volume</label><input id="v" type="range" min="0" max="1" step=".05" value="${P.settings?.vol??.6}"><button class="p" id="ok">SALVAR</button><button id="bk">VOLTAR</button></div>`);
  $("#bk").onclick=menu;$("#ok").onclick=async()=>{try{await FB.patchProfile(U.uid,{"settings.vol":+$("#v").value});menu()}catch(e){fail(e)}}}
FB.watch(u=>{U=u;u?menu():loginScreen(false)});

return {};
})();
</script></body></html>
